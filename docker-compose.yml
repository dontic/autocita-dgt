# AutoCita DGT - Docker Compose Configuration
# This service monitors the Spanish Traffic Agency (DGT) website for available
# appointment slots. Everything is configured from the web UI at http://<host>:8000

services:
  autocita-dgt:
    # Docker image from Docker Hub (built via GitHub Actions on release)
    image: dontic/autocita-dgt:latest
    ports:
      # Web UI. It has no authentication, so don't expose it to the internet.
      - "8000:8000"
    volumes:
      # Settings, the running/stopped session flag and the current booking are saved here
      - ./data:/app/data
    environment:
      # DEBUG: Set to True to enable debug logs and step-by-step screenshots.
      - DEBUG=False

    # Run an init process as PID 1 so the Chrome processes started on every
    # check are reaped instead of piling up as zombies.
    init: true

    # Automatically restart the container unless explicitly stopped.
    restart: unless-stopped
